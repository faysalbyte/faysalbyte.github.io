# =============================================================================
#  Nginx configuration for the portfolio (static files + optional reverse proxy)
#  Requires nginx >= 1.25 for HTTP/3 (QUIC). Replace example.com, cert paths,
#  and the upstream. GitHub Pages does NOT use this file.
#  Optional modules: ngx_brotli (brotli), headers-more is NOT required.
# =============================================================================

# --- http{} level (put these in nginx.conf or conf.d/*.conf) ------------------
# server-side cache for proxied responses (API / dynamic upstream)
proxy_cache_path /var/cache/nginx/faysal levels=1:2 keys_zone=faysal_cache:20m max_size=500m inactive=60m use_temp_path=off;
# rate limiting (evasive / qos equivalent)
limit_req_zone  $binary_remote_addr zone=req_per_ip:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

# real client IP when behind Cloudflare / a load balancer (mod_remoteip equivalent)
# set_real_ip_from 127.0.0.1;
# real_ip_header   X-Forwarded-For;
# real_ip_recursive on;

# cache lifetimes by content type
map $sent_http_content_type $cache_control {
  default                         "public, max-age=604800, must-revalidate";
  ~*text/html                     "no-cache";
  ~*image/                        "public, max-age=31536000, immutable";
  ~*font/                         "public, max-age=31536000, immutable";
  ~*video/                        "public, max-age=31536000, immutable";
  ~*application/pdf               "public, max-age=2592000";
  ~*(text/plain|application/xml)  "public, max-age=3600";
}

upstream mern_api {
  server 127.0.0.1:5000;        # Node/Express back end (optional)
  keepalive 16;
}

# --- HTTP -> HTTPS + www -> apex ---------------------------------------------
server {
  listen 80;
  listen [::]:80;
  server_name example.com www.example.com;
  location /.well-known/acme-challenge/ { root /var/www/faysalbyte; }
  location / { return 301 https://example.com$request_uri; }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  listen 443 quic;           # HTTP/3
  listen [::]:443 quic;
  http2 on;                            # HTTP/2 (nginx >= 1.25.1)
  server_name www.example.com;
  ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
  return 301 https://example.com$request_uri;
}

# --- main site ---------------------------------------------------------------
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  listen 443 quic reuseport;
  listen [::]:443 quic reuseport;
  http2 on;
  http3 on;
  server_name example.com;

  root  /var/www/faysalbyte;
  index index.html;
  charset utf-8;
  server_tokens off;

  # ---- SSL / TLS ----
  ssl_certificate         /etc/letsencrypt/live/example.com/fullchain.pem;
  ssl_certificate_key     /etc/letsencrypt/live/example.com/privkey.pem;
  ssl_trusted_certificate /etc/letsencrypt/live/example.com/chain.pem;
  ssl_protocols           TLSv1.2 TLSv1.3;
  ssl_ciphers             ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
  ssl_prefer_server_ciphers off;
  ssl_session_cache       shared:SSL:20m;
  ssl_session_timeout     1d;
  ssl_session_tickets     off;
  ssl_stapling            on;
  ssl_stapling_verify     on;
  resolver                1.1.1.1 8.8.8.8 valid=300s;
  ssl_early_data          off;
  quic_retry              on;

  # ---- Security / control headers (see security-headers.conf) ----
  include /etc/nginx/snippets/faysal-security-headers.conf;   # copy security-headers.conf there

  # ---- Compression ----
  gzip on;
  gzip_comp_level 5;
  gzip_vary on;
  gzip_min_length 512;
  gzip_types text/plain text/css text/xml application/xml application/javascript application/json application/manifest+json application/ld+json image/svg+xml;
  # brotli on;                      # needs ngx_brotli
  # brotli_comp_level 5;
  # brotli_types text/plain text/css text/xml application/xml application/javascript application/json application/manifest+json application/ld+json image/svg+xml;

  # ---- Timeouts / limits (mod_reqtimeout + mod_qos equivalents) ----
  client_header_timeout 20s;
  client_body_timeout   20s;
  send_timeout          30s;
  keepalive_timeout     65s;
  client_max_body_size  1m;
  limit_conn conn_per_ip 30;
  limit_req  zone=req_per_ip burst=40 nodelay;

  # ---- Redirects ----
  location = /index.html { return 301 /; }
  # clean URLs: /skills.html -> /skills (301); /skills is served from skills.html
  # ($request_uri is the ORIGINAL client URI, so the internal try_files hop cannot loop)
  if ($request_uri ~ "^/(?<clean>[^?]+)\.html(\?.*)?$") { return 301 /$clean; }
  location ~ ^/portfolio/?$ { return 301 /; }
  location ~ ^/portfolio/(.+)$ { return 301 /$1; }

  # ---- Pages that must not be indexed ----
  location = /thank-you {
    include /etc/nginx/snippets/faysal-security-headers.conf;
    add_header X-Robots-Tag "noindex, nofollow" always;   # overrides the snippet's index value
    try_files /thank-you.html =404;
  }

  # ---- Static files ----
  location / {
    try_files $uri $uri.html $uri/ =404;
  }
  location ~* \.(?:webp|jpe?g|png|svg|ico|mp4|woff2?)$ {
    access_log off;
    try_files $uri =404;
  }

  # ---- Reverse proxy to the MERN API with server-side caching (optional) ----
  location /api/ {
    proxy_pass http://mern_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
    proxy_cache faysal_cache;
    proxy_cache_methods GET HEAD;
    proxy_cache_valid 200 301 302 10m;
    proxy_cache_valid 404 1m;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_cache_background_update on;
    proxy_cache_lock on;
    include /etc/nginx/snippets/faysal-security-headers.conf;
    add_header X-Cache-Status $upstream_cache_status always;
  }

  # ---- Hidden files / private paths ----
  location ~ /\.(?!well-known/) { deny all; return 404; }
  location ~* \.(?:env|ini|log|bak|sql|sh|md|lock|conf)$ { deny all; return 404; }
  location ^~ /tools/ { deny all; return 404; }
  location ^~ /server-config/ { deny all; return 404; }

  # ---- Errors ----
  error_page 404 /404.html;
  location = /404.html { internal; }
}
