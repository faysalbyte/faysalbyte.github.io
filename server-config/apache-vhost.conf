# =============================================================================
#  Apache virtual host (server-level) - modules that CANNOT be set in .htaccess
#  Needs root access. Replace example.com + certificate paths.
#  Enable modules first, e.g. on Debian/Ubuntu:
#    a2enmod ssl http2 headers rewrite expires deflate brotli remoteip reqtimeout \
#            proxy proxy_http security2 evasive qos
#  mod_pagespeed: install from the package for your distro (or use Nginx/CDN).
#  HTTP/3 (QUIC): stock Apache does not ship it. Terminate h3 on Nginx, Caddy,
#  LiteSpeed or a CDN (Cloudflare) and keep Apache behind it.
# =============================================================================

# ---- HTTP/2 -------------------------------------------------------------
Protocols h2 http/1.1

# ---- mod_remoteip: real client IP behind a CDN / reverse proxy ----------
<IfModule remoteip_module>
  RemoteIPHeader X-Forwarded-For
  # trust only your proxy/CDN ranges (example: local reverse proxy)
  RemoteIPInternalProxy 127.0.0.1
</IfModule>

# ---- mod_reqtimeout: slowloris protection -------------------------------
<IfModule reqtimeout_module>
  RequestReadTimeout header=20-40,MinRate=500 body=20,MinRate=500
</IfModule>

# ---- mod_evasive: basic DoS / brute-force throttling --------------------
<IfModule evasive20_module>
  DOSHashTableSize    3097
  DOSPageCount        5
  DOSSiteCount        100
  DOSPageInterval     1
  DOSSiteInterval     1
  DOSBlockingPeriod   60
  DOSLogDir           /var/log/mod_evasive
</IfModule>

# ---- mod_qos: connection / bandwidth limits -----------------------------
<IfModule qos_module>
  QS_ClientEventBlockCount 20 300
  QS_SrvMaxConnPerIP       50
  MaxClients               256
  QS_SrvRequestRate        120
</IfModule>

# ---- mod_security (OWASP Core Rule Set recommended) ---------------------
<IfModule security2_module>
  SecRuleEngine On
  SecRequestBodyAccess On
  SecResponseBodyAccess Off
  # IncludeOptional /etc/modsecurity/crs/crs-setup.conf
  # IncludeOptional /etc/modsecurity/crs/rules/*.conf
</IfModule>

# ---- mod_pagespeed (server-wide) ----------------------------------------
<IfModule pagespeed_module>
  ModPagespeed on
  ModPagespeedFileCachePath "/var/cache/mod_pagespeed/"
  ModPagespeedRewriteLevel CoreFilters
  ModPagespeedEnableFilters collapse_whitespace,remove_comments,rewrite_css,rewrite_javascript,rewrite_images,lazyload_images,extend_cache
</IfModule>

# ---- HTTP -> HTTPS ------------------------------------------------------
<VirtualHost *:80>
  ServerName example.com
  ServerAlias www.example.com
  Redirect permanent / https://example.com/
</VirtualHost>

# ---- HTTPS (TLS 1.2 / 1.3) ---------------------------------------------
<VirtualHost *:443>
  ServerName example.com
  ServerAlias www.example.com
  DocumentRoot /var/www/faysalbyte
  Protocols h2 http/1.1

  SSLEngine on
  SSLCertificateFile    /etc/letsencrypt/live/example.com/fullchain.pem
  SSLCertificateKeyFile /etc/letsencrypt/live/example.com/privkey.pem
  SSLProtocol           -all +TLSv1.2 +TLSv1.3
  SSLCipherSuite        ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305
  SSLHonorCipherOrder   off
  SSLSessionTickets     off
  SSLUseStapling        on
  SSLStaplingCache      "shmcb:/var/run/ocsp(128000)"

  <Directory /var/www/faysalbyte>
    AllowOverride All
    Require all granted
  </Directory>

  # ---- Reverse proxy example: Node/Express API of a MERN back end ----
  # ProxyPreserveHost On
  # ProxyPass        /api/ http://127.0.0.1:5000/api/
  # ProxyPassReverse /api/ http://127.0.0.1:5000/api/

  ErrorLog  ${APACHE_LOG_DIR}/faysalbyte-error.log
  CustomLog ${APACHE_LOG_DIR}/faysalbyte-access.log combined
</VirtualHost>
